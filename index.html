<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style1.css">
    <title>🎸 Inscrições para a banda da escola 🎺</title>
</head>

<body>

    <form action="mysql" method="post">
        
        <h1>Teste para a Banda</h1>

        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" placeholder="Ex: João Augusto">

        <label for="idade">Idade:</label>
        <input type="number" id="idade" name="idade" placeholder="Ex: 16">

        <label for="instrumento">Instrumento:</label>
        <input type="text" id="instrumento" name="instrumento" placeholder="Ex: Piano, bateria, canto">

        <button type="submit">Garantir meu teste</button>

    </form>

</body>

</html>
